# Конфигурация для деплоя папки dzquest на Cloudflare Pages.
# Не обязателен, если публикуете через Dashboard (drag-and-drop / Git) —
# тогда биндинг AI нужно один раз включить руками:
#   Dashboard → Workers & Pages → ваш проект → Settings → Functions →
#   "AI" bindings → Add binding → имя переменной: AI
#
# Если публикуете через wrangler (npx wrangler pages deploy .), этот файл
# включит биндинг автоматически.

name = "dzquest"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ACCOUNTS"
id = "5b5ef985ec964942b4fd557c74d6d734"
